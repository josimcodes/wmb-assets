name: Sync LTA Transit Data

on:
  schedule:
    # Runs at 19:00 UTC every Sunday (3:00 AM SGT Monday)
    - cron: '0 19 * * 0'
  workflow_dispatch: # Enables manual "Run workflow" button in GitHub UI

permissions:
  contents: write # Allows committing the updated JSON files

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run LTA Data Sync
        env:
          LTA_API_KEY: ${{ secrets.LTA_API_KEY }}
        run: node sync.js

      - name: Commit and Push if Changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Automated LTA transit data sync"
            git push
          fi
